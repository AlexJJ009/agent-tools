name: goal-plan-runtime

on:
  pull_request:
    paths:
      - .github/workflows/goal-plan-runtime.yml
      - goal_plan/runtime/pyproject.toml
      - goal_plan/runtime/src/goal_plan_runtime/__init__.py
      - goal_plan/runtime/src/goal_plan_runtime/cli.py
      - goal_plan/runtime/tests/test_runtime.py
      - goal_plan/runtime/uv.lock
  push:
    branches:
      - main
    paths:
      - .github/workflows/goal-plan-runtime.yml
      - goal_plan/runtime/pyproject.toml
      - goal_plan/runtime/src/goal_plan_runtime/__init__.py
      - goal_plan/runtime/src/goal_plan_runtime/cli.py
      - goal_plan/runtime/tests/test_runtime.py
      - goal_plan/runtime/uv.lock

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install candidate
        run: python -m pip install ./goal_plan/runtime
      - name: Run full unit suite
        run: python -m unittest discover -s goal_plan/runtime/tests -v
      - name: Check environment
        run: python -m pip check
      - name: Verify versions
        run: >-
          python -c "import importlib.metadata as m, pathlib, sys, tomllib, goal_plan_runtime as g; p=tomllib.loads(pathlib.Path('goal_plan/runtime/pyproject.toml').read_text()); l=tomllib.loads(pathlib.Path('goal_plan/runtime/uv.lock').read_text()); actual=(p['project']['version'], g.__version__, m.version('goal-plan-runtime'), [row['version'] for row in l['package'] if row['name']=='goal-plan-runtime']); expected=('0.2.1','0.2.1','0.2.1',['0.2.1']); sys.exit(f'version mismatch: {actual!r}') if actual != expected else None"

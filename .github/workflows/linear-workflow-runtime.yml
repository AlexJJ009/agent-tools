name: linear-workflow-runtime

on:
  pull_request:
    paths:
      - .github/workflows/linear-workflow-runtime.yml
      - .github/actions/linear-workflow-pr-check/**
      - .github/pull_request_template.md
      - .linear-workflow.yml
      - AGENTS.md
      - CLAUDE.md
      - CONTRIBUTING.md
      - linear_workflow/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/linear-workflow-runtime.yml
      - .github/actions/linear-workflow-pr-check/**
      - .github/pull_request_template.md
      - .linear-workflow.yml
      - AGENTS.md
      - CLAUDE.md
      - CONTRIBUTING.md
      - linear_workflow/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linear-workflow-runtime:
    name: linear-workflow-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Build isolated wheel
        run: python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" ./linear_workflow/shared/runtime
      - name: Install isolated candidate
        run: |
          python -m venv "$RUNNER_TEMP/linear-workflow-venv"
          "$RUNNER_TEMP/linear-workflow-venv/bin/python" -m pip install "$RUNNER_TEMP"/wheels/*.whl
      - name: Verify installed environment
        run: "$RUNNER_TEMP/linear-workflow-venv/bin/python" -m pip check
      - name: Run runtime, adapter, and gate tests
        run: "$RUNNER_TEMP/linear-workflow-venv/bin/python" -m unittest discover -s linear_workflow/shared/runtime/tests -v
      - name: Run repository tests
        run: "$RUNNER_TEMP/linear-workflow-venv/bin/python" -m unittest discover -s tests -v
      - name: Validate generated adapters
        run: "$RUNNER_TEMP/linear-workflow-venv/bin/python" linear_workflow/scripts/assemble_adapters.py --check
      - name: Validate metadata, workflow, and adoption contract
        run: "$RUNNER_TEMP/linear-workflow-venv/bin/python" linear_workflow/scripts/validate_repo_adoption.py
      - name: Compile Python sources
        run: "$RUNNER_TEMP/linear-workflow-venv/bin/python" -m compileall -q linear_workflow scripts tests
      - name: Reject whitespace errors
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          git diff --check "$base_sha"..HEAD

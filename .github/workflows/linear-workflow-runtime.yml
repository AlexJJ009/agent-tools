name: agent-tools-regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    # Preserve the existing required status context; the ruleset still names it.
    name: linear-workflow-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install report test dependencies
        run: python -m pip install markdown-it-py==4.0.0 PyYAML==6.0.2
      - name: Run active component regressions
        run: python scripts/run_regression_tests.py active
      - name: Select historical compatibility scope and check whitespace
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          git diff --check "$base_sha" HEAD
          changed="$(git diff --name-only "$base_sha" HEAD)"
          if [[ "$EVENT_NAME" == workflow_dispatch ]] || grep -Eq '^(linear_workflow/|config/managed-packages/linear-workflow.json$|scripts/managed_package_installer.py$|scripts/run_regression_tests.py$|\.github/workflows/linear-workflow-runtime.yml$)' <<< "$changed"; then
            echo 'legacy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'legacy=false' >> "$GITHUB_OUTPUT"
            echo 'Historical Linear compatibility: no related changes; not executed.'
          fi
      - name: Build and install historical compatibility package
        if: steps.scope.outputs.legacy == 'true'
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" ./linear_workflow/shared/runtime
          python -m venv "$RUNNER_TEMP/linear-workflow-venv"
          "$RUNNER_TEMP/linear-workflow-venv/bin/python" -m pip install "$RUNNER_TEMP"/wheels/*.whl
      - name: Test historical compatibility package
        if: steps.scope.outputs.legacy == 'true'
        run: '"$RUNNER_TEMP/linear-workflow-venv/bin/python" scripts/run_regression_tests.py linear-compatibility'

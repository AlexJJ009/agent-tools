name: agent-tools-regression

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    # Legacy status name: ruleset 20623617 requires this context. Rename both together.
    name: regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Resolve comparison base and check whitespace
        id: scope
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          base_sha="$PR_BASE_SHA"
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$PUSH_BEFORE_SHA"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          git diff --check "$base_sha" HEAD
          echo "base=$base_sha" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            suites="$(python scripts/run_regression_tests.py active --list)"
          else
            suites="$(python scripts/run_regression_tests.py active --changed-from "$base_sha" --list)"
          fi
          echo "suites=$suites" >> "$GITHUB_OUTPUT"
      - name: Install report test dependencies
        if: contains(steps.scope.outputs.suites, 'reports')
        run: python -m pip install markdown-it-py==4.0.0 PyYAML==6.0.2
      - name: Run affected component regressions
        env:
          BASE_SHA: ${{ steps.scope.outputs.base }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            python scripts/run_regression_tests.py active
          else
            python scripts/run_regression_tests.py active --changed-from "$BASE_SHA"
          fi

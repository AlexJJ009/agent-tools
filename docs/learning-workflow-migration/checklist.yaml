- id: AC-14
  requirements:
  - R09
  title: Explicit curation with portable provenance
  phase: M3
  required: true
  method: artifact_export_and_reimport
  procedure: Curate a selected project lesson to a chosen folder, relocate its fixture, import the index twice, and remove
    source access.
  pass_condition: The note is self-contained, keeps source revision and ownership, deduplicates index entries, flags
    inaccessible sources, and neither writes Zotero nor publishes unless explicitly in scope.
  evidence_required:
  - curated_note
  - index_before_after
  - relocation_result
  - side_effect_log
  cases:
  - T17

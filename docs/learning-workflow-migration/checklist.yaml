- id: AC-05
  requirements:
  - R01
  - R11
  title: Real Hook lifecycle and explicit coverage
  phase: M1
  required: true
  method: native_host_event_trace
  procedure: In an isolated supported host, observe session start, submitted input, covered tool pre/post events, and
    bounded stop handling.
  pass_condition: Supported events actually run; unbound sessions remain usable; no classifier model is launched inside
    a command Hook; tool/event coverage is listed precisely.
  evidence_required:

- id: AC-06
  requirements:
  - R01
  - R02
  - R11
  title: Hook absence and stale-state behavior
  phase: M1
  required: true
  method: failure_injection
  procedure: Disable Hooks, withhold route handling, and stale a bound protected-action record; exercise the real covered
    entry and harmless reads.
  pass_condition: Covered protected actions reject missing prerequisites at their entry; harmless reads continue; missing
    Hook coverage is disclosed; no universal interception claim.
  evidence_required:
  - red_control
  - entrypoint_trace
  - harmless_read_result
  - coverage_limits

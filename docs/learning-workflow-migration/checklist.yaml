  title: Isolated installation, relocation, and scoped rollback
  phase: M3
  required: true
  method: isolated_profile_installation_trial
  procedure: Run the existing target guard; install candidate into an isolated profile, move its source checkout, retain
    foreign hooks, and restore the prechange configuration.
  pass_condition: Skills and required resources resolve after relocation; installed does not falsely imply hook activation;

schema_version: learning-migration-acceptance/1
document_status: proposed_for_review
implementation_status: not_started
candidate_revision: null
purpose: Acceptance specification for a future implementation; not an agent-workflow runtime record.
status_values:
- not_run
- pass
- fail
- blocked
human_status_values:
- pending
- accepted
- rejected
- not_required
evidence_policy:
- Bind actual evidence to the reviewed candidate and tested host.
- Preserve failed controls and tool traces; generated expected text is not execution evidence.
- Keep simulated, native-host, independent-review, and user-feedback evidence separate.
- Do not convert this document review into implementation or human acceptance.
items:
- id: AC-01
  requirements:
  - R03
  title: Preserve the existing teaching baseline
  phase: M0
  required: true
  method: source_diff_and_behavior_comparison
  procedure: Inventory real install targets and revisions; compare preserved prompt sections and representative outputs
    against the candidate.
  pass_condition: Core teaching behaviors and terminology remain available; every intentional semantic change is explained;
    no unrelated prompt rewrite.
  evidence_required:
  - source_inventory
  - scoped_diff
  - paired_teaching_outputs
  cases:
  - T07
  - T08
  - T29

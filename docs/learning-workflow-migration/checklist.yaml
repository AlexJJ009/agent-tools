- id: AC-21
  requirements:
  - R03
  - R10
  - R11
  title: Bounded user pilot and explicit acceptance
  phase: M3
  required: true
  method: actual_user_feedback
  procedure: Present one representative learning exchange and one manuscript draft/revision for focused feedback; distinguish
    modeled learner fixtures from actual user attempts.
  pass_condition: Record the user's specific judgment on readability, help level, output space and writing usefulness;
    unresolved material objections remain open; feedback is scoped and never inferred.
  evidence_required:
  - review_navigation
  - actual_user_feedback
  - resolved_or_open_findings

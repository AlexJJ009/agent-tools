[project]
name = "linear-workflow-runtime"
version = "0.3.0"
description = "Deterministic contracts and Planning/Delivery runtime for Linear Workflow"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
linear-workflow = "linear_workflow_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linear_workflow_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"../schemas" = "linear_workflow_runtime/schemas"
"../gate-policy.json" = "linear_workflow_runtime/gate-policy.json"

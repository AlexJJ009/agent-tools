version: 3.0.0
minimum_visuals: 0
cold_read_required: true
placeholders: [TODO]
sections:
  - id: goal
    title: Goal and scope
  - id: progress
    title: Current progress
  - id: decisions
    title: Decisions and reasons
  - id: evidence
    title: Observations and evidence
  - id: scope
    title: Limits and scope changes
  - id: next_steps
    title: Next steps and decisions
criteria:
  - id: goal
    allow_na: false
    standard: Explain the reader's problem, intended outcome, current result and boundary without changing the agreed target. Organize a standalone account around the reader's task; answer later chat questions separately.
  - id: evidence
    allow_na: false
    standard: Connect each important claim to a concrete observation, traceable source and reason the observation supports the claim. Distinguish complete, active, failed and unverified work. Expose adverse evidence and unresolved review findings in the main argument. A passed tool or existing file does not prove business success. Reconcile the frozen workflow snapshot and current delivery state.
  - id: decisions
    allow_na: true
    standard: Explain the important choice, alternatives, mechanism, evidence, reason and consequence. Synthesize sources by the question they answer. Record actual decisions when made; do not invent tradeoffs or retrospective reasons. If no important choice arose, say so.
  - id: scope
    allow_na: false
    standard: Compare the original request and revisions with actual work. Separate necessary implementation, existing user changes, unknowns and added scope. Disclosed drift can pass as reporting; do not require unrelated business repairs or silently accept results for the user.
  - id: next_steps
    allow_na: false
    standard: State the concrete next action or acceptance decision and its consequence. A progress report retains the original goal and resume point; delivering it does not finish the development task. Honor existing authority and reporting agreements without inventing new approval obligations.
  - id: readability
    allow_na: false
    standard: A cold reader can reconstruct the goal, main finding and reason, an important choice, and next decision from the artifact alone. Use precise terms with concrete referents and explain unfamiliar mechanisms once. Each paragraph has a useful role. Tables and figures are optional and must clarify an actual comparison; length, terminology and polished prose cannot replace an argument.

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>本机代理 · 节点与连接</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --panel: #171b22;
      --panel2: #202632;
      --text: #eef2f8;
      --muted: #aeb8c7;
      --line: #303846;
      --good: #44d17d;
      --bad: #ff6673;
      --warn: #ffc857;
      --blue: #65a7ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 22px;
      border-bottom: 1px solid var(--line);
      background: #12161d;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 650;
    }
    select { max-width: 100%; background: #202632; color: #eef2f8; padding: 8px; border: 1px solid #303846; border-radius: 6px; }
    button {
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--text);
      border-radius: 6px;
      padding: 7px 11px;
      cursor: pointer;
    }
    button:hover { border-color: var(--blue); }
    main {
      display: grid;
      grid-template-columns: minmax(340px, 430px) minmax(0, 1fr);
      gap: 16px;
      padding: 16px;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    h2 {
      font-size: 14px;
      margin: 0;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      background: #151a22;
    }
    .stack { display: grid; gap: 16px; align-content: start; }
    main { align-items: start; }
    main > section { max-height: calc(100vh - 104px); overflow: auto; }
    th { top: 0; }
    .rows { padding: 10px; display: grid; gap: 8px; }
    .row {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      gap: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      background: #121821;
      border: 1px solid #222b37;
    }
    .key { color: var(--muted); }
    .value {
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .ok { color: var(--good); }
    .bad { color: var(--bad); }
    .warn { color: var(--warn); }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      text-align: left;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th {
      color: var(--muted);
      font-weight: 600;
      background: #151a22;
      position: sticky;
      top: 57px;
      z-index: 1;
    }
    .chain {
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }
    .pill {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 1px 7px;
      margin-right: 5px;
      color: var(--muted);
      white-space: nowrap;
    }
    .active { color: var(--good); border-color: rgba(68, 209, 125, .5); }
    .small { color: var(--muted); font-size: 12px; }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      th { position: static; }
    }
  </style>
</head>
<body>
  <header>
    <h1>本机代理 · 节点与连接</h1>
    <div>
      <span class="small" id="updated">not loaded</span>
      <button id="refresh">刷新</button>
    </div>
  </header>
  <main>
    <div class="stack">
      <section>
        <h2>当前选择</h2>
        <div class="rows" id="summary"></div>
      </section>
      <section>
        <h2>主入口分组</h2>
        <div class="rows" id="mainGroups"></div>
        <details>
          <summary>诊断详情</summary>
          <div class="rows" id="mainDiagnostics"></div>
        </details>
      </section>
      <section>
        <h2>开发机分组：飞兔 / 喵喵备用</h2>
        <div class="rows" id="feituGroups"></div>
        <details>
          <summary>诊断详情</summary>
          <div class="rows" id="feituDiagnostics"></div>
        </details>
      </section>
    </div>
    <section>
      <h2>实时连接</h2>
      <table>
        <thead>
          <tr>
            <th style="width: 30%">Host</th>
            <th style="width: 12%">入口</th>
            <th style="width: 44%">链路</th>
            <th style="width: 14%">时长</th>
          </tr>
        </thead>
        <tbody id="connections"></tbody>
      </table>
    </section>
  </main>
  <script>
let nodeLabels = {};
const params = new URLSearchParams(location.search);
const defaultMainPorts = (params.get("mainPorts") || "7903,7902").split(",").map(v => v.trim()).filter(Boolean);
const feituPort = params.get("feituPort") || "17903";
const controllers = { main: null, feitu: "http://127.0.0.1:" + feituPort };
async function loadLabels(){for(const path of [params.get("labels"),"main-ai-node-labels.json","node-labels.json","../state/main-ai-node-labels.json","../state/node-labels.json"].filter(Boolean)){try{const data=await (await fetch(path,{cache:"no-store",signal:AbortSignal.timeout(1500)})).json();nodeLabels={...nodeLabels,...data};}catch{}}}
const displayNames = {'us-ai':'AI 使用策略','ai-auto-fallback':'美国优先 / 日常回退','ai-quality':'美国组综合选路','us-ai-auto-READONLY':'美国组延时自动','proxy':'日常节点（跟随 v2rayN）','server-feitu':'开发机使用策略','feitu-quality':'飞兔优先 / 喵喵备用','feitu-auto':'双订阅延时自动（不含内容验收）'};
const mainDiagnosticNames = ['ai-auto-fallback','ai-quality','us-ai-auto-READONLY'];
const feituDiagnosticNames = ['feitu-quality','feitu-auto'];
const summary=document.querySelector('#summary'), mainGroups=document.querySelector('#mainGroups'), mainDiagnostics=document.querySelector('#mainDiagnostics'), feituGroups=document.querySelector('#feituGroups'), feituDiagnostics=document.querySelector('#feituDiagnostics'), connections=document.querySelector('#connections'), updated=document.querySelector('#updated');
let busy=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function label(v){return displayNames[v]||nodeLabels[v]||v||'未知';}
function row(k,v,cls=''){return `<div class="row"><div class="key">${esc(k)}</div><div class="value ${cls}">${v}</div></div>`;}
async function getJson(base,path){const r=await fetch(base+path,{cache:'no-store',signal:AbortSignal.timeout(2500)});if(!r.ok)throw Error(`HTTP ${r.status}`);return r.json();}
async function mainData(){for(const base of [...new Set([controllers.main,...defaultMainPorts.map(port => "http://127.0.0.1:" + port)].filter(Boolean))]){try{const p=await getJson(base,'/proxies');controllers.main=base;return p;}catch{}}throw Error('主内核暂不可达');}
function chain(p,tag){const result=[],seen=new Set();while(tag&&!seen.has(tag)){seen.add(tag);result.push(label(tag));tag=p[tag]?.now;}return result.join(' → ');}
function groupRows(p,names){return names.map(n=>{const v=p[n];if(!v)return row(label(n),'暂不可用','warn');const h=v.history||[],d=h.at(-1)?.delay;return row(label(n),`<span class="pill">${esc(v.type)}</span> ${v.now?`<span class="pill active">${esc(label(v.now))}</span>`:''}${v.all?`<span class="pill">${v.all.length} 个候选</span>`:''}${Number.isFinite(d)?`<span class="pill">${d} ms</span>`:''}`);}).join('');}
function chooser(p,tag,core){const v=p[tag];if(!v?.all)return '';return `<div class="row"><div class="key">手动 / 自动</div><div class="value"><select data-choice="${core}">${v.all.map(n=>`<option value="${esc(n)}" ${n===v.now?'selected':''}>${esc(label(n))}</option>`).join('')}</select> <button data-apply="${core}" data-tag="${tag}">应用</button><div class="small">只改变使用策略，不开关 TUN 或系统代理。</div></div></div>`;}
function renderConnections(items){connections.innerHTML=items.slice(0,200).map(({item,core})=>{const m=item.metadata||{},host=`${m.host||m.destinationIP||''}:${m.destinationPort||''}`,age=item.start?Math.max(0,Math.round((Date.now()-Date.parse(item.start))/1000)):'';return `<tr><td>${esc(host)}</td><td>${esc(core)}<div class="small">${esc(m.type||'')}</div></td><td><div class="chain">${esc((item.chains||[]).map(label).join(' → '))}</div><div class="small">${esc(item.rule||'')}</div></td><td>${age} s</td></tr>`;}).join('')||'<tr><td colspan="4">暂无活动连接；打开网页后会自动显示。</td></tr>';}
async function refresh(){if(busy||document.activeElement?.tagName==='SELECT')return;busy=true;try{
 const [m,f]=await Promise.allSettled([mainData(),getJson(controllers.feitu,'/proxies')]);
 const mp=m.status==='fulfilled'?m.value.proxies:{},fp=f.status==='fulfilled'?f.value.proxies:{};
 summary.innerHTML=[row('主内核',m.status==='fulfilled'?esc(controllers.main):'暂不可达',m.status==='fulfilled'?'ok':'bad'),row('开发机内核',f.status==='fulfilled'?'已连接':'暂不可达',f.status==='fulfilled'?'ok':'bad'),row('AI 当前链路',esc(chain(mp,'us-ai'))),row('日常代理',esc(label('proxy'))),row('开发机当前链路',esc(chain(fp,'server-feitu')))].join('');
 mainGroups.innerHTML=chooser(mp,'us-ai','main');
 mainDiagnostics.innerHTML=groupRows(mp,mainDiagnosticNames);
 feituGroups.innerHTML=chooser(fp,'server-feitu','feitu');
 feituDiagnostics.innerHTML=groupRows(fp,feituDiagnosticNames);
 const sources=await Promise.allSettled([controllers.main?getJson(controllers.main,'/connections'):Promise.reject(),getJson(controllers.feitu,'/connections')]);
 const items=[];sources.forEach((r,i)=>{if(r.status==='fulfilled')for(const item of r.value.connections||[])items.push({item,core:i?'开发机 / 双订阅':'本机'});});
 renderConnections(items);updated.textContent=new Date().toLocaleString();
 }finally{busy=false;}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-apply]');if(!b)return;const core=b.dataset.apply,tag=b.dataset.tag,value=document.querySelector(`[data-choice="${core}"]`).value,base=controllers[core];b.disabled=true;try{const r=await fetch(base+'/proxies/'+encodeURIComponent(tag),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:value}),signal:AbortSignal.timeout(3000)});if(!r.ok)throw Error(`HTTP ${r.status}`);const check=await getJson(base,'/proxies/'+encodeURIComponent(tag));if(check.now!==value)throw Error('选择回读不一致');await refresh();}catch(err){alert('切换未完成：'+err.message);}finally{b.disabled=false;}});
document.querySelector('#refresh').addEventListener('click',()=>refresh().catch(showError));
function showError(e){updated.textContent='刷新失败：'+e.message;}
loadLabels().finally(()=>refresh().catch(showError));setInterval(()=>refresh().catch(showError),3000);

  </script>
</body>
</html>
